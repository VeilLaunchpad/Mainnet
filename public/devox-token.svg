<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="DEVOXPAD token">
  <title>DEVOXPAD — $DEVOX</title>
  <desc>The protocol token of DEVOXPAD on COTI. A sealed hexagon: the outer shell is public, the inner mark is what only a key opens.</desc>

  <defs>
    <linearGradient id="dv-edge" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8f99ff"/>
      <stop offset="1" stop-color="#00e5ff"/>
    </linearGradient>

    <linearGradient id="dv-face" x1="52" y1="26" x2="204" y2="230" gradientUnits="userSpaceOnUse">
      <stop stop-color="#131c4d"/>
      <stop offset="1" stop-color="#050c22"/>
    </linearGradient>

    <linearGradient id="dv-mark" x1="92" y1="88" x2="168" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#8f99ff"/>
      <stop offset="1" stop-color="#00e5ff"/>
    </linearGradient>

    <radialGradient id="dv-glow" cx="0.5" cy="0.42" r="0.6">
      <stop stop-color="#1e29f6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1e29f6" stop-opacity="0"/>
    </radialGradient>

  </defs>

  <!-- Outer shell: public, and meant to be seen. -->
  <path d="M128 8 232 68v120L128 248 24 188V68Z" fill="url(#dv-edge)"/>
  <path d="M128 22 220 75v106l-92 53-92-53V75Z" fill="url(#dv-face)"/>
  <ellipse cx="128" cy="112" rx="96" ry="86" fill="url(#dv-glow)"/>

  <!-- The X of DEVOX: two full diagonals, so it reads as a letter and not as a
       pinwheel. Splitting them into four offset strokes looked like a propeller
       at every size, which is the wrong word entirely. -->
  <g stroke="url(#dv-mark)" stroke-width="16" stroke-linecap="round" fill="none">
    <path d="M94 90 L162 158"/>
    <path d="M162 90 L94 158"/>
  </g>

  <!-- The seal sits where the two strokes cross: the one point the shell
       protects, bright against everything around it. -->
  <circle cx="128" cy="124" r="13" fill="#050c22"/>
  <circle cx="128" cy="124" r="6.5" fill="#00e5ff"/>
</svg>
