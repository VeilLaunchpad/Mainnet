<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1030"/>
      <stop offset="1" stop-color="#06121c"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="50%">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- the veil: what is public is drawn, what is behind it is not -->
  <g fill="none" stroke="url(#mark)" stroke-width="2" opacity="0.5">
    <path d="M96 300c40-26 80-26 120 0s80 26 120 0 80-26 80-26"/>
    <path d="M96 330c40-26 80-26 120 0s80 26 120 0 80-26 80-26"/>
    <path d="M96 360c40-26 80-26 120 0s80 26 120 0 80-26 80-26"/>
  </g>

  <circle cx="256" cy="196" r="62" fill="none" stroke="url(#mark)" stroke-width="3"/>
  <circle cx="256" cy="196" r="20" fill="url(#mark)" opacity="0.85"/>

  <text x="256" y="424" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="30" font-weight="700" fill="#ffffff" letter-spacing="6">VEILPAD</text>
  <text x="256" y="454" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="14" fill="#ffffff" opacity="0.45" letter-spacing="4">GENESIS · COTI</text>
</svg>
